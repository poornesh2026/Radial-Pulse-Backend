# DEV: deploys automatically after CI passes on main.
name: Deploy DEV

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
