# DEV: deploys automatically after CI passes on main.
name: Deploy DEV

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    # Only a PUSH to main in THIS repo (never a pull request, never a fork's branch called main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: dev
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
